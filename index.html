<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة مستر أحمد محمود</title>

<style>
:root {
 --navy:#14243c;
 --blue:#3568e8;
 --bg:#f4f7fc;
 --white:#fff;
 --text:#202d42;
 --muted:#8491a5;
 --border:#e7ecf3;
 --green:#16a36a;
 --red:#e34e5b;
}
* {box-sizing:border-box}
body {
 margin:0;
 font-family:Tahoma,Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
}
button,input,select,textarea {font:inherit}
button {cursor:pointer;border:0}
.hidden {display:none!important}

/* Login */
.login-page {
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:20px;
 background:linear-gradient(135deg,#12243e,#284d81);
}
.login-box {
 background:white;
 width:100%;
 max-width:420px;
 padding:35px;
 border-radius:22px;
 box-shadow:0 20px 70px #0003;
}
.logo {
 width:58px;height:58px;
 display:grid;place-items:center;
 background:#e9efff;color:var(--blue);
 border-radius:17px;
 font-size:27px;margin-bottom:18px;
}
.login-box h2 {margin:0 0 8px}
.muted {color:var(--muted);font-size:13px}
.field {margin:18px 0}
.field label {display:block;font-size:13px;margin-bottom:8px}
input,select,textarea {
 width:100%;padding:12px;
 border:1px solid var(--border);
 border-radius:10px;
 background:white;outline:none;
}
input:focus,select:focus,textarea:focus {
 border-color:var(--blue);
}
.primary {
 background:var(--blue);
 color:white;padding:12px 18px;
 border-radius:10px;
}
.primary:hover {background:#2453c8}
.full {width:100%}
.error {color:var(--red);font-size:13px;margin-top:12px}

/* Application layout */
.app {min-height:100vh}
.sidebar {
 position:fixed;right:0;top:0;bottom:0;
 width:250px;background:var(--navy);
 color:white;padding:23px 16px;
 display:flex;flex-direction:column;
 z-index:5;
}
.brand {
 display:flex;align-items:center;gap:12px;
 padding:8px 5px 28px;
 border-bottom:1px solid #ffffff20;
}
.brand-icon {
 background:#ffff;padding:12px;
 border-radius:12px;font-size:20px;
}
.brand strong {display:block;font-size:15px}
.brand small {color:#aebbd0}
.menu-title {
 color:#8193ac;font-size:11px;
 margin:25px 12px 10px;
}
.menu button {
 display:block;width:100%;
 text-align:right;color:#c3cee0;
 background:transparent;padding:13px;
 border-radius:9px;margin:4px 0;
 font-size:13px;
}
.menu button:hover,.menu button.active {
 background:#ffffff17;color:white;
}
.logout {
 margin-top:auto;background:#ffffff12;
 color:#ffb7b7;padding:13px;border-radius:9px;
}
.main {margin-right:250px;padding:28px 35px}
.topbar {
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:28px;
 gap:15px;
}
.topbar h2 {margin:0 0 7px;font-size:23px}
.profile {
 background:white;padding:10px 15px;
 border:1px solid var(--border);
 border-radius:12px;display:flex;
 align-items:center;gap:10px;
}
.avatar {
 width:38px;height:38px;border-radius:12px;
 background:#e7eeff;color:var(--blue);
 display:grid;place-items:center;font-weight:bold;
}
.grid {
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:16px;margin-bottom:23px;
}
.stat,.panel,.card {
 background:white;border:1px solid var(--border);
 border-radius:15px;padding:20px;
}
.stat small {color:var(--muted)}
.stat h2 {font-size:28px;margin:12px 0 5px}
.stat .symbol {font-size:22px;color:var(--blue)}
.panel {margin-bottom:20px}
.panel h3 {margin:0 0 18px;font-size:17px}
.section-title {
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:18px;
}
.section-title h3 {margin:0}
.cards {
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:15px;
}
.card h3 {font-size:16px;margin:8px 0}
.card p {font-size:13px;color:var(--muted);line-height:1.8}
.tag {
 display:inline-block;padding:5px 9px;
 background:#edf2ff;color:var(--blue);
 border-radius:7px;font-size:11px;
}
.btn-small {
 padding:8px 12px;border-radius:8px;
 background:#edf2ff;color:var(--blue);
 font-size:12px;margin:3px;
}
.btn-danger {background:#fff0f0;color:var(--red)}
.btn-green {background:#e7f8ef;color:var(--green)}
table {width:100%;border-collapse:collapse;font-size:13px}
th,td {padding:14px 10px;text-align:right;border-bottom:1px solid var(--border)}
th {color:var(--muted);font-weight:normal}
.empty {text-align:center;color:var(--muted);padding:30px}
.form-grid {
 display:grid;grid-template-columns:1fr 1fr;gap:15px;
}
.form-grid .field {margin:5px 0}
textarea {min-height:110px;resize:vertical}
.question-builder {
 padding:16px;border:1px solid var(--border);
 border-radius:12px;margin:14px 0;
}
.question-builder h4 {margin:0 0 12px}
.option-grid {
 display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.exam-question {
 border:1px solid var(--border);
 padding:18px;border-radius:12px;margin:14px 0;
}
.exam-question label {
 display:block;padding:10px;background:#f7f9fc;
 margin:8px 0;border-radius:8px;
 cursor:pointer;font-size:14px;
}
.exam-question input {width:auto;margin-left:8px}
.notice {
 padding:14px;border-radius:10px;
 background:#fff6df;color:#966b17;
 font-size:13px;line-height:1.8;
}
.progress {
 height:8px;background:#e9edf5;
 border-radius:10px;overflow:hidden;margin:12px 0;
}
.progress span {display:block;height:100%;background:var(--blue)}
@media(max-width:900px) {
 .sidebar {width:200px}
 .main {margin-right:200px;padding:20px}
 .grid {grid-template-columns:repeat(2,1fr)}
 .cards {grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px) {
 .sidebar {
  position:relative;width:100%;
  height:auto;padding:12px;
 }
 .brand {padding-bottom:12px}
 .menu {display:flex;overflow-x:auto}
 .menu-title {display:none}
 .menu button {min-width:max-content;padding:10px}
 .logout {margin-top:10px}
 .main {margin:0;padding:15px}
 .grid {gap:8px}
 .stat {padding:13px}
 .stat h2 {font-size:22px}
 .cards,.form-grid {grid-template-columns:1fr}
 .topbar h2 {font-size:18px}
}

/* ===== Visual refresh ===== */
:root {
  --navy:#101d33;
  --blue:#4169f5;
  --bg:#f5f7fc;
  --text:#1d2a40;
  --muted:#77859b;
  --border:#e8edf5;
  --surface:#ffffff;
  --shadow:0 8px 28px rgba(25,45,80,.06);
}
body { background:var(--bg); }
.login-page {
  background:
    radial-gradient(circle at 15% 20%, #5f83ff55, transparent 30%),
    radial-gradient(circle at 85% 80%, #6ab6ff33, transparent 28%),
    linear-gradient(135deg,#101d33,#254b80);
}
.login-box {
  border:1px solid #ffffff70;
  box-shadow:0 28px 90px #07152c66;
  animation:loginIn .45s ease both;
}
@keyframes loginIn {
  from { opacity:0; transform:translateY(12px) scale(.985); }
  to { opacity:1; transform:translateY(0) scale(1); }
}
.login-box h2 { color:#172945; letter-spacing:-.3px; }
.logo { box-shadow:0 8px 20px #3568e822; }
.sidebar {
  background:linear-gradient(180deg,#101d33,#172d4d);
  box-shadow:-8px 0 30px #0c1b3212;
}
.brand-icon {
  display:grid; place-items:center;
  min-width:44px; min-height:44px;
  background:linear-gradient(135deg,#fff,#e8efff);
  color:var(--blue);
  box-shadow:0 5px 16px #0002;
}
.menu button {
  transition:background .2s ease, color .2s ease, transform .2s ease;
}
.menu button:hover { transform:translateX(-3px); }
.menu button.active {
  background:linear-gradient(90deg,#ffffff28,#ffffff0d);
  box-shadow:inset -3px 0 #8eafff;
}
.main { max-width:1600px; }
.topbar { min-height:64px; }
.topbar h2 { letter-spacing:-.4px; }
.profile {
  box-shadow:0 4px 16px #1b31500a;
  transition:box-shadow .2s ease, transform .2s ease;
}
.profile:hover { box-shadow:var(--shadow); transform:translateY(-1px); }
.stat,.panel,.card {
  background:var(--surface);
  border-color:var(--border);
  box-shadow:var(--shadow);
  transition:transform .2s ease, box-shadow .2s ease;
}
.stat:hover,.card:hover {
  transform:translateY(-3px);
  box-shadow:0 14px 34px rgba(25,45,80,.10);
}
.stat { position:relative; overflow:hidden; }
.stat:after {
  content:""; position:absolute; left:-24px; bottom:-34px;
  width:92px; height:92px; border-radius:50%;
  background:#4169f50b;
}
.stat .symbol { display:inline-grid; place-items:center; width:40px;height:40px;
  border-radius:12px;background:#edf2ff;margin-bottom:8px; }
.card { display:flex; flex-direction:column; align-items:flex-start; }
.card p { flex:1; }
.primary,.btn-small,.btn-danger,.btn-green,.logout,.icon-action {
  transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
}
.primary { box-shadow:0 5px 14px #3568e82b; }
.primary:hover,.btn-small:hover,.logout:hover,.icon-action:hover {
  filter:brightness(.97); transform:translateY(-1px);
}
input,select,textarea {
  transition:border-color .2s ease, box-shadow .2s ease;
}
input:focus,select:focus,textarea:focus {
  border-color:var(--blue);
  box-shadow:0 0 0 3px #4169f51c;
}
table tr:hover td { background:#f8faff; }
.tag { font-weight:600; }
.icon-action {
  display:grid;place-items:center;
  width:42px;height:42px;border-radius:12px;
  background:#fff;color:var(--navy);
  border:1px solid var(--border);font-size:19px;
}
.topbar-actions { margin-right:auto; }
.mobile-menu-button { display:none; }
.sidebar-backdrop { display:none; }

/* Optional dark appearance */
body.dark-mode {
  --bg:#0c1422; --surface:#142136; --text:#e8eef8;
  --muted:#9aa9bf; --border:#263750; --navy:#0b1525;
  background:var(--bg); color:var(--text);
}
body.dark-mode .profile,
body.dark-mode .icon-action,
body.dark-mode input,
body.dark-mode select,
body.dark-mode textarea { background:#142136;color:var(--text);border-color:var(--border); }
body.dark-mode .stat,body.dark-mode .panel,body.dark-mode .card { background:var(--surface); }
body.dark-mode .menu button.active { background:#ffffff20; }
body.dark-mode table tr:hover td { background:#1b2b43; }
body.dark-mode .exam-question label { background:#1b2b43; }
body.dark-mode .tag,.dark-mode .btn-small { background:#22385c;color:#b9ccff; }
body.dark-mode .stat .symbol { background:#22385c; }
body.dark-mode .notice { background:#3a321f;color:#f3d58b; }
body.dark-mode table,
body.dark-mode th,
body.dark-mode td { color:var(--text); border-color:var(--border); }
body.dark-mode .empty { color:var(--muted); }

@media(max-width:900px) {
  .main { padding:22px; }
}
@media(max-width:600px) {
  .sidebar {
    position:fixed; right:0; top:0; bottom:0;
    width:min(290px,84vw); height:100vh;
    padding:18px 14px;
    transform:translateX(105%);
    transition:transform .25s ease;
    overflow-y:auto;
    z-index:20;
  }
  .sidebar.open { transform:translateX(0); }
  .sidebar-backdrop {
    position:fixed; inset:0; z-index:19;
    background:#07132680; backdrop-filter:blur(2px);
  }
  .sidebar-backdrop.show { display:block; }
  .brand { padding-bottom:18px; }
  .menu { display:block; overflow:visible; }
  .menu-title { display:block; }
  .menu button { min-width:0; padding:13px; }
  .logout { margin-top:20px; width:100%; }
  .main { margin:0; padding:14px; }
  .topbar { gap:9px; align-items:center; margin-bottom:20px; }
  .mobile-menu-button { display:grid; flex:0 0 42px; }
  .topbar-actions { margin-right:auto; }
  .profile { padding:7px 9px; gap:7px; }
  .profile .muted { font-size:11px; }
  .avatar { width:34px;height:34px; }
  .topbar h2 { font-size:17px; }
  .topbar .muted { font-size:11px; }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .stat { min-width:0; padding:13px; }
  .stat h2 { font-size:21px; }
  .cards,.form-grid { grid-template-columns:1fr; }
  .panel { padding:16px; }
  .section-title { gap:10px; flex-wrap:wrap; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
}

/* Login page refresh v3 */
.login-page {
 position:relative;overflow:hidden;
 background:
  radial-gradient(circle at 12% 18%,#6d8fff55 0,transparent 28%),
  radial-gradient(circle at 88% 82%,#40c6c455 0,transparent 25%),
  linear-gradient(135deg,#101d35,#1e3d69 58%,#254f82);
}
.login-page:before,.login-page:after {
 content:"";position:absolute;border:1px solid #ffffff18;border-radius:50%;
 width:430px;height:430px;pointer-events:none;
}
.login-page:before {top:-250px;right:-140px}
.login-page:after {bottom:-300px;left:-160px;width:560px;height:560px}
.login-box {
 position:relative;z-index:1;max-width:440px;padding:38px 36px 30px;
 border:1px solid #ffffffa8;border-radius:25px;
 box-shadow:0 28px 90px #06152d66;
}
.login-brand {
 width:68px;height:68px;display:grid;place-items:center;margin:0 auto 18px;
 border-radius:21px;color:#fff;background:linear-gradient(145deg,#4779f4,#244fc2);
 box-shadow:0 10px 25px #3568e844;font-size:31px;
}
.login-box h2 {margin:0 0 9px;text-align:center;color:#172945;font-size:24px}
.login-subtitle {text-align:center;line-height:1.8;margin:0 0 27px;color:#8290a5;font-size:13px}
.login-box .field {margin:17px 0}
.login-box .field label {display:block;font-size:13px;font-weight:700;color:#35445b;margin-bottom:9px}
.login-box input {
 width:100%;padding:14px;border:1px solid #e1e7f0;border-radius:12px;
 background:#f9fbfe;outline:none;color:#1d2b41;transition:.2s;
}
.login-box input:focus {border-color:#4779f4;background:#fff;box-shadow:0 0 0 4px #4779f41c}
.password-wrap {position:relative}
.password-wrap input {padding-left:76px}
.show-password {
 position:absolute;left:8px;top:50%;transform:translateY(-50%);
 padding:7px 9px;border-radius:8px;background:#edf2ff;color:#315ed0;
 font-size:12px;font-weight:700;
}
.login-submit {
 width:100%;margin-top:8px;padding:14px 18px;border-radius:12px;
 color:#fff;background:linear-gradient(110deg,#4779f4,#2856ce);
 font-weight:700;box-shadow:0 8px 18px #3568e833;transition:transform .2s,box-shadow .2s;
}
.login-submit:hover {transform:translateY(-1px);box-shadow:0 12px 22px #3568e844}
.login-error {min-height:18px;color:var(--red);font-size:13px;text-align:center;margin:12px 0 0}
.login-footer {border-top:1px solid #edf0f5;margin-top:24px;padding-top:17px;text-align:center;color:#a0aaba;font-size:11px}
@media(max-width:480px) {.login-box{padding:30px 22px 24px;border-radius:21px}.login-box h2{font-size:21px}}

/* Settings page */
.settings-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.settings-panel {margin:0}
.settings-account {grid-column:1/-1}
.settings-heading {display:flex;align-items:center;gap:12px;margin-bottom:20px}
.settings-heading h3 {margin:0 0 5px}
.settings-heading p {margin:0}
.settings-icon {width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:#edf2ff;font-size:22px}
.settings-panel>label,.settings-panel .field label {display:block;font-size:13px;font-weight:700;margin-bottom:8px}
.settings-note {font-size:12px;line-height:1.8;margin:12px 0 0}
.settings-divider {height:1px;background:var(--border);margin:20px 0}
.settings-account h4 {margin:0 0 15px}
body.dark-mode .settings-icon {background:#22385c}
body.english-mode .menu button {text-align:left}
body.english-mode .sidebar {left:0;right:auto}
body.english-mode .main {margin-right:0;margin-left:250px}
body.english-mode .topbar-actions {margin-right:0;margin-left:auto}
@media(max-width:900px) {
 .settings-grid {grid-template-columns:1fr}
 .settings-account {grid-column:auto}
 body.english-mode .main {margin-left:200px}
}
@media(max-width:600px) {
 body.english-mode .sidebar {left:auto;right:0}
 body.english-mode .main {margin:0}
}

/* Account password safety */
.password-protected {letter-spacing:2px;color:var(--muted);font-weight:700}

/* Firebase status indicator */
.fb-status {
 position:fixed; bottom:12px; left:12px;
 padding:6px 12px; border-radius:20px;
 font-size:11px; font-weight:700;
 background:#e7f8ef; color:#16a36a;
 z-index:100; box-shadow:0 4px 14px rgba(0,0,0,.12);
}
.fb-status.offline { background:#fff0f0; color:#e34e5b; }
.fb-status.syncing { background:#fff6df; color:#966b17; }

/* ===== PDF Notes & Question Bank additions ===== */
.pdf-viewer {
 width:100%;
 height:75vh;
 border:1px solid var(--border);
 border-radius:12px;
 background:#f9fbfe;
}
.pdf-card { display:flex; flex-direction:column; }
.pdf-card .pdf-preview-icon {
 width:100%;height:120px;display:grid;place-items:center;
 background:linear-gradient(135deg,#fff0f0,#ffe0e0);
 color:var(--red);font-size:38px;border-radius:10px;margin-bottom:10px;
}
.bank-filters {
 display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;
}
.bank-filters select,.bank-filters input {
 padding:9px 12px;font-size:13px;border-radius:9px;
 width:auto;min-width:140px;
}
.bank-question {
 padding:16px;border:1px solid var(--border);
 border-radius:12px;margin:12px 0;background:#fff;
}
.bank-question .bank-q-head {
 display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
 align-items:center;margin-bottom:10px;
}
.bank-question .bank-q-text {font-weight:700;line-height:1.8;margin:6px 0}
.bank-question .bank-q-options {margin:8px 0;padding-right:20px}
.bank-question .bank-q-options li {margin:5px 0;font-size:14px;line-height:1.7}
.bank-question .bank-q-answer {
 background:#e7f8ef;color:#0f7a4f;padding:8px 12px;border-radius:8px;
 font-size:13px;font-weight:700;display:inline-block;margin-top:6px;
}
body.dark-mode .bank-question {background:var(--surface)}
body.dark-mode .pdf-card .pdf-preview-icon {background:#3a1c1c;color:#ff9a9a}

/* ===== Interactive question bank ===== */
.bank-q-interactive {
 padding:18px;border:1px solid var(--border);
 border-radius:14px;margin:14px 0;background:#fff;
 transition:border-color .2s ease, box-shadow .2s ease;
}
.bank-q-interactive.solved-correct {border-color:#16a36a;background:linear-gradient(135deg,#fff,#f0fdf6)}
.bank-q-interactive.solved-wrong {border-color:#e34e5b;background:linear-gradient(135deg,#fff,#fff5f5)}
.bank-q-interactive.solved-pending {border-color:#dba617;background:linear-gradient(135deg,#fff,#fffbf0)}
body.dark-mode .bank-q-interactive {background:var(--surface)}
body.dark-mode .bank-q-interactive.solved-correct {background:linear-gradient(135deg,#142136,#0f2a1e)}
body.dark-mode .bank-q-interactive.solved-wrong {background:linear-gradient(135deg,#142136,#2a1010)}
body.dark-mode .bank-q-interactive.solved-pending {background:linear-gradient(135deg,#142136,#2a2410)}

.bank-opt-row {
 display:flex;align-items:center;gap:10px;
 padding:11px 14px;margin:6px 0;border-radius:10px;
 background:#f7f9fc;border:2px solid transparent;
 cursor:pointer;transition:all .18s ease;font-size:14px;
}
.bank-opt-row:hover {background:#eef3ff}
.bank-opt-row input {width:auto;margin:0;cursor:pointer;accent-color:var(--blue)}
.bank-opt-row.selected {border-color:var(--blue);background:#eef3ff}
.bank-opt-row.correct-answer {
 border-color:#16a36a;background:#e7f8ef;color:#0f7a4f;font-weight:700;
}
.bank-opt-row.wrong-answer {
 border-color:#e34e5b;background:#fff0f0;color:#b32e3b;
}
body.dark-mode .bank-opt-row {background:#1b2b43}
body.dark-mode .bank-opt-row:hover {background:#22385c}
body.dark-mode .bank-opt-row.selected {background:#22385c;border-color:var(--blue)}
body.dark-mode .bank-opt-row.correct-answer {background:#0f2a1e;color:#5ee9a7;border-color:#16a36a}
body.dark-mode .bank-opt-row.wrong-answer {background:#2a1010;color:#ff9a9a;border-color:#e34e5b}

.bank-feedback {
 margin-top:12px;padding:12px 14px;border-radius:10px;
 font-size:13px;font-weight:700;line-height:1.8;
}
.bank-feedback.correct {background:#e7f8ef;color:#0f7a4f}
.bank-feedback.wrong {background:#fff0f0;color:#b32e3b}
.bank-feedback.pending {background:#fffbf0;color:#966b17}
body.dark-mode .bank-feedback.correct {background:#0f2a1e;color:#5ee9a7}
body.dark-mode .bank-feedback.wrong {background:#2a1010;color:#ff9a9a}
body.dark-mode .bank-feedback.pending {background:#2a2410;color:#f3d58b}

.bank-progress-card {

<script>
// ===================================
// DATA
// ===================================

const getData = (key, fallback) => {
 try {
  const data = localStorage.getItem(key);
  return data ? JSON.parse(data) : fallback;
 } catch {
  return fallback;
 }
};

let users = getData("ah_users", [
 {id:1,name:"أحمد محمود",username:"ahmed",password:"1234",role:"teacher"},
 {id:2,name:"علي محمد",username:"ali",password:"1234",role:"student"}
]);

let lessons = getData("ah_lessons", [
 {id:1,title:"مقدمة في Python",description:"تعرف على لغة Python وأهم استخداماتها.",content:"Python لغة برمجة سهلة وقوية.\n\nمثال:\nprint('Hello World')"},
 {id:2,title:"المتغيرات",description:"تعلم كيفية تخزين البيانات.",content:"المتغير يستخدم لتخزين البيانات.\n\nمثال:\nname = 'Ahmed'\nage = 16"}
]);

let exams = getData("ah_exams", []);
let results = getData("ah_results", []);
let assignments = getData("ah_assignments", []);
let pdfNotes = getData("ah_pdf_notes", []);
let questionBank = getData("ah_question_bank", []);

// ✅ إجابات الطلاب في بنك الأسئلة
// structure: { [username]: { [questionId]: { answer, isCorrect, status, submittedAt, manualScore, feedback } } }
let bankAnswers = getData("ah_bank_answers", {});

let currentUser = null;
let activeExam = null;

function save() {
 localStorage.setItem("ah_users", JSON.stringify(users));
 localStorage.setItem("ah_lessons", JSON.stringify(lessons));
 localStorage.setItem("ah_exams", JSON.stringify(exams));
 localStorage.setItem("ah_results", JSON.stringify(results));
 localStorage.setItem("ah_assignments", JSON.stringify(assignments));
 localStorage.setItem("ah_pdf_notes", JSON.stringify(pdfNotes));
 localStorage.setItem("ah_question_bank", JSON.stringify(questionBank));
 localStorage.setItem("ah_bank_answers", JSON.stringify(bankAnswers));

 syncToFirebase();
}

async function syncToFirebase() {
 if (!window.firebaseReady || !window.firebaseDB) return;
 const badge = document.getElementById("fbStatus");
 if (badge) { badge.textContent = "🟡 Firebase: جاري الحفظ..."; badge.className = "fb-status syncing"; }
 try {
  const { db, doc, setDoc } = window.firebaseDB;
  await setDoc(doc(db, "platform", "data"), {
   users, lessons, exams, results, assignments, pdfNotes, questionBank, bankAnswers,
   updatedAt: new Date().toISOString()
  });
  if (badge) { badge.textContent = "🟢 Firebase: متصل"; badge.className = "fb-status"; }
 } catch (e) {
  console.error("❌ فشل الحفظ على Firebase:", e);
  if (badge) { badge.textContent = "🔴 Firebase: خطأ ("+(e.code||"unknown")+")"; badge.className = "fb-status offline"; }
 }
}
async function loadFromFirebase() {
 if (!window.firebaseReady || !window.firebaseDB) {
  const badge = document.getElementById("fbStatus");
  if (badge) { badge.textContent = "🔴 Firebase: غير متاح"; badge.className = "fb-status offline"; }
  return;
 }
 const badge = document.getElementById("fbStatus");
 if (badge) { badge.textContent = "🟡 Firebase: جاري التحميل..."; badge.className = "fb-status syncing"; }
 try {
  const { db, doc, getDoc } = window.firebaseDB;
  const snap = await getDoc(doc(db, "platform", "data"));
  if (snap.exists()) {
   const data = snap.data();
   const firebaseUsers = Array.isArray(data.users) ? data.users : [];
   const defaults = [
    {id:1, name:"أحمد محمود", username:"hassan", password:"1234", role:"teacher"},
    {id:2, name:"علي محمد", username:"ali", password:"1234", role:"student"}
   ];
   const merged = [...defaults];
   firebaseUsers.forEach(fu => {
    const idx = merged.findIndex(m => m.username === fu.username);
    if (idx >= 0) merged[idx] = fu;
    else merged.push(fu);
   });
   users = merged;

   if (Array.isArray(data.lessons) && data.lessons.length) lessons = data.lessons;
   if (Array.isArray(data.exams)) exams = data.exams;
   if (Array.isArray(data.results)) results = data.results;
   if (Array.isArray(data.assignments)) assignments = data.assignments;
   if (Array.isArray(data.pdfNotes)) pdfNotes = data.pdfNotes;
   if (Array.isArray(data.questionBank)) questionBank = data.questionBank;
   if (data.bankAnswers && typeof data.bankAnswers === "object") bankAnswers = data.bankAnswers;

   localStorage.setItem("ah_users", JSON.stringify(users));
   localStorage.setItem("ah_lessons", JSON.stringify(lessons));
   localStorage.setItem("ah_exams", JSON.stringify(exams));
   localStorage.setItem("ah_results", JSON.stringify(results));
   localStorage.setItem("ah_assignments", JSON.stringify(assignments));
   localStorage.setItem("ah_pdf_notes", JSON.stringify(pdfNotes));
   localStorage.setItem("ah_question_bank", JSON.stringify(questionBank));
   localStorage.setItem("ah_bank_answers", JSON.stringify(bankAnswers));

   console.log("✅ تم تحميل البيانات من Firebase");
   if (badge) { badge.textContent = "🟢 Firebase: متصل"; badge.className = "fb-status"; }

   if (merged.length > firebaseUsers.length) await syncToFirebase();
  } else {
   console.log("ℹ️ لا توجد بيانات على Firebase، رفع البيانات الحالية...");
   await syncToFirebase();
  }
 } catch (e) {
  console.error("❌ فشل التحميل من Firebase:", e);
  if (badge) { badge.textContent = "🔴 Firebase: خطأ ("+(e.code||"unknown")+")"; badge.className = "fb-status offline"; }
 }
}

function esc(value) {
 return String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function toggleLoginPassword() {
 const input = document.getElementById("loginPass");
 const button = document.getElementById("showPasswordBtn");
 const visible = input.type === "password";
 input.type = visible ? "text" : "password";
 button.textContent = visible ? "إخفاء" : "إظهار";
}

function login() {
 const username = document.getElementById("loginUser").value.trim();
 const password = document.getElementById("loginPass").value;

 const user = users.find(u => u.username === username && u.password === password);

 if (!user) {
  document.getElementById("loginError").textContent = "اسم المستخدم أو كلمة المرور غير صحيحة";
  return;
 }

 currentUser = user;
 document.getElementById("loginPage").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");

 document.getElementById("profileName").textContent = user.name;
 document.getElementById("avatar").textContent = user.name[0] || "A";
 document.getElementById("profileRole").textContent =
  user.role === "teacher" ? "مدرس" : "طالب";

 applyLanguage();
 buildMenu();
 go(user.role === "teacher" ? "home" : "studentHome");
}

function logout() {
 currentUser = null;
 activeExam = null;
 if (window.examTimer) clearInterval(window.examTimer);
 document.getElementById("app").classList.add("hidden");
 document.getElementById("loginPage").classList.remove("hidden");
 document.getElementById("loginPass").value = "";

 lessons:["إدارة الدروس","إضافة وتعديل محتوى المنهج"],
 teacherAssignments:["الواجبات","إضافة الواجبات ومراجعة إجابات الطلاب وتصحيحها"],
 pdfNotes:["الملازم PDF","رفع وإدارة الملازم بصيغة PDF"],

 createExam:["إنشاء امتحان","جهز اختباراً جديداً لطلابك"],

 studentExams:["الامتحانات","اختبر مستواك في البرمجة"],
 studentResults:["نتائجي","تابع درجاتك وتقدمك"],

 );

}

 if (toggle) toggle.textContent = dark ? "☀" : "☾";

async function importWordLesson(event) {
 const file = event.target.files[0];
 if (!file) return;

 if (!file.name.toLowerCase().endsWith(".docx")) {
  alert("من فضلك اختر ملف Word بصيغة DOCX");
  event.target.value = "";
  return;
 }

 try {
  const arrayBuffer = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer });
  const content = result.value.trim();

  if (!content) { alert("الملف لا يحتوي على نص"); return; }

  document.getElementById("lessonText").value = content;
  const titleInput = document.getElementById("lessonName");
  if (!titleInput.value.trim()) titleInput.value = file.name.replace(/\.docx$/i, "");

  alert("تم استيراد الدرس بنجاح من ملف Word");
 } catch (error) {
  alert("حدث خطأ أثناء قراءة ملف Word");
  console.error(error);
 }

 event.target.value = "";
}

    </div>` : `

     <textarea id="homeworkAnswer_${a.id}" rows="4" placeholder="اكتب إجابتك هنا">${esc(submission.answer)}</textarea>
    </div>
    <button class="primary" onclick="submitHomework(${a.id})">تحديث الإجابة</button>`}
  ` : `
   <div class="field">
    <label>اكتب إجابتك</label>
    <textarea id="homeworkAnswer_${a.id}" rows="5" placeholder="اكتب إجابتك هنا..."></textarea>

function submitHomework(id) {
 const a = assignments.find(x => x.id === id);
 if (!a) return alert("الواجب غير موجود");
 const existing = (a.submissions || []).find(s => s.username === currentUser.username);
 if (existing && existing.grade !== null && existing.grade !== undefined)
  return alert("تم تصحيح هذا الواجب بالفعل، ولا يمكن تعديل الإجابة");

 const field = document.getElementById("homeworkAnswer_" + id);
 const answer = field ? field.value.trim() : "";
 if (!answer) return alert("اكتب إجابتك قبل الإرسال");

 if (!a.submissions) a.submissions = [];
 const submission = {
  username: currentUser.username,
  studentName: currentUser.name,
  answer,
  submittedAt: new Date().toLocaleString("ar-EG"),
  grade: null,
  feedback: ""
 };
 const index = a.submissions.findIndex(s => s.username === currentUser.username);
 if (index >= 0) a.submissions[index] = submission;
 else a.submissions.push(submission);

 save();
 alert("تم إرسال إجابتك بنجاح");
 go("studentAssignments");
}

function gradeHomework(assignmentId, submissionIndex) {
 const a = assignments.find(x => x.id === assignmentId);
 if (!a) return;
 const submission = (a.submissions || [])[submissionIndex];
 if (!submission) return;

 const rawGrade = prompt("اكتب درجة الطالب من " + a.total, submission.grade ?? "");
 if (rawGrade === null) return;
 const grade = Number(rawGrade);
 if (rawGrade.trim() === "" || !Number.isFinite(grade) || grade < 0 || grade > a.total)
  return alert("اكتب درجة صحيحة من 0 إلى " + a.total);

 const feedback = prompt("اكتب ملاحظاتك للطالب (اختياري)", submission.feedback || "");
 if (feedback === null) return;

 submission.grade = grade;
 submission.feedback = feedback.trim();
 submission.gradedAt = new Date().toLocaleString("ar-EG");
 save();
 alert("تم حفظ التصحيح بنجاح");
 go("teacherAssignments");
}

let pendingPdfData = null;

function handlePdfSelect(event) {
 const file = event.target.files[0];
 const box = document.getElementById("pdfPreviewBox");
 if (!file) { box.textContent = ""; pendingPdfData = null; return; }
 if (file.type !== "application/pdf") {
  box.textContent = "❌ الملف ليس PDF";
  pendingPdfData = null;
  return;
 }
 if (file.size > 8 * 1024 * 1024) {
  box.textContent = "⚠️ الملف كبير (أكثر من 8 ميجا) قد لا يتزامن بسلاسة";
 }
 const reader = new FileReader();
 reader.onload = () => {
  pendingPdfData = { name: file.name, dataUrl: reader.result, size: file.size };
  box.textContent = `✅ تم اختيار: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;
 };
 reader.readAsDataURL(file);
}

function uploadPdfNote() {
 const title = document.getElementById("pdfTitle").value.trim();
 const description = document.getElementById("pdfDesc").value.trim();
 if (!title) return alert("اكتب عنوان الملزمة");
 if (!pendingPdfData) return alert("اختر ملف PDF أولاً");

 pdfNotes.push({
  id: Date.now(),
  title, description,
  fileName: pendingPdfData.name,
  dataUrl: pendingPdfData.dataUrl,
  size: pendingPdfData.size,
  createdAt: new Date().toLocaleString("ar-EG")
 });
 pendingPdfData = null;
 save();
 alert("تم رفع الملزمة بنجاح");
 go("pdfNotes");
}

function gradeBankTextAnswer(questionId, username) {
 const q = questionBank.find(x => x.id === questionId);

 const ans = bankAnswers[username] && bankAnswers[username][questionId];
 if (!ans) return;

 const raw = prompt("اكتب درجة الطالب (من 1)", ans.manualScore ?? "1");
 if (raw === null) return;
 const score = Number(raw);
 if (raw.trim() === "" || !Number.isFinite(score) || score < 0) return alert("درجة غير صحيحة");

 const fb = prompt("ملاحظات (اختياري)", ans.feedback || "");
 if (fb === null) return;

 ans.manualScore = score;
 ans.feedback = fb.trim();
 ans.status = score >= 1 ? "correct" : "wrong";
 ans.gradedAt = new Date().toLocaleString("ar-EG");

 save();
 alert("تم حفظ التصحيح");
 viewBankQuestionStats(questionId);
}

  `;
 }

 return `<div class="bank-q-interactive ${solvedClass}">
  <div class="bank-q-head">
   <div>
    <span class="tag">${q.type === "mcq" ? "MCQ" : q.type === "tf" ? (en?"True/False":"صح/خطأ") : (en?"Text":"نصي")}</span>
    ${q.topic ? `<span class="muted" style="margin-right:8px">${esc(q.topic)}</span>` : ""}
    ${status === "correct" ? `<span class="bank-status-pill correct">${en?"Solved":"محلول"}</span>` : ""}
    ${status === "wrong" ? `<span class="bank-status-pill wrong">${en?"Wrong":"خطأ"}</span>` : ""}
    ${status === "pending" ? `<span class="bank-status-pill pending">${en?"Pending":"قيد التصحيح"}</span>` : ""}
   </div>
  </div>
  <div class="bank-q-text" style="margin:10px 0;font-size:15px;line-height:1.9">${esc(q.text)}</div>
  ${body}
 </div>`;
}

// الطالب: إجابة MCQ أو True/False → تصحيح فوري
function submitBankAnswer(questionId, selectedIndex) {
 const q = questionBank.find(x => x.id === questionId);
 if (!q) return;

 if (!bankAnswers[currentUser.username]) bankAnswers[currentUser.username] = {};
 const existing = bankAnswers[currentUser.username][questionId];
 if (existing && existing.status === "correct") return; // لا تغيير بعد الصح

 let isCorrect = false;
 let displayAnswer = "";
 if (q.type === "mcq") {
  isCorrect = selectedIndex === q.correct;
  displayAnswer = q.options[selectedIndex] || "";
 } else if (q.type === "tf") {
  const boolAns = selectedIndex === 0;
  isCorrect = boolAns === q.correct;
  displayAnswer = boolAns ? "صح" : "خطأ";
 }

 bankAnswers[currentUser.username][questionId] = {
  selectedIndex,
  displayAnswer,
  isCorrect,
  status: isCorrect ? "correct" : "wrong",
  submittedAt: new Date().toLocaleString("ar-EG")
 };

 save();
 go("questionBank");
}

// الطالب: إجابة نصية
function submitBankTextAnswer(questionId) {
 const q = questionBank.find(x => x.id === questionId);
 if (!q) return;
 const field = document.getElementById("bankTextAns_" + questionId);
 const text = field ? field.value.trim() : "";
 if (!text) return alert("اكتب إجابتك");

 if (!bankAnswers[currentUser.username]) bankAnswers[currentUser.username] = {};
 bankAnswers[currentUser.username][questionId] = {
  displayAnswer: text,
  status: "pending",
  submittedAt: new Date().toLocaleString("ar-EG")
 };
 save();
 alert("تم إرسال إجابتك، في انتظار تصحيح المدرس");
 go("questionBank");
}

// الطالب: إعادة المحاولة بعد إجابة خاطئة
function retryBankQuestion(questionId) {
 if (!bankAnswers[currentUser.username]) return;
 delete bankAnswers[currentUser.username][questionId];
 save();
 go("questionBank");
}

function addQuestion(type) {
 draftQuestions.push({ id: ++qCounter, type });

}

function renderQuestions() {
 const box = document.getElementById("questionList");
 if (!box) return;
 document.getElementById("questionCount").textContent = draftQuestions.length + " سؤال";

 box.innerHTML = draftQuestions.map((q, i) => {
  const bank = q.fromBank;
  return `
 <div class="question-builder" id="q_${q.id}">
  <h4>السؤال ${i + 1} - ${
   q.type === "mcq" ? "اختيار من متعدد" : q.type === "tf" ? "صح أو خطأ" : "إجابة نصية"
  } ${bank ? '<span class="tag">من البنك</span>' : ''}</h4>
  <input class="q-title" placeholder="اكتب السؤال هنا" value="${bank ? esc(bank.text) : ""}">
  <div class="${q.type === "mcq" ? "option-grid" : ""}">
  ${q.type === "mcq" ? [0,1,2,3].map(n => `
   <input class="q-option" placeholder="الاختيار ${n + 1}" value="${bank && bank.options ? esc(bank.options[n]||"") : ""}">
  `).join("") : ""}
  </div>
  ${q.type === "mcq" ? `
   <label>الإجابة الصحيحة</label>
   <select class="q-correct">
    <option value="0" ${bank && bank.correct===0?"selected":""}>الاختيار الأول</option>
    <option value="1" ${bank && bank.correct===1?"selected":""}>الاختيار الثاني</option>
    <option value="2" ${bank && bank.correct===2?"selected":""}>الاختيار الثالث</option>
    <option value="3" ${bank && bank.correct===3?"selected":""}>الاختيار الرابع</option>
   </select>` : ""}
  ${q.type === "tf" ? `
   <label>الإجابة الصحيحة</label>
   <select class="q-correct">
    <option value="true" ${bank && bank.correct===true?"selected":""}>صح</option>
    <option value="false" ${bank && bank.correct===false?"selected":""}>خطأ</option>
   </select>` : ""}
  ${q.type === "text" ? `
   <label>الإجابة النموذجية للتصحيح اليدوي</label>
   <input class="q-model" placeholder="اكتب الإجابة النموذجية" value="${bank && bank.model ? esc(bank.model) : ""}">
   <p class="muted">سيتم عرض إجابة الطالب للمدرس لتصحيحها يدوياً.</p>` : ""}
  <button class="btn-small btn-danger" onclick="removeQuestion(${q.id})">حذف السؤال</button>
 </div>`;
 }).join("");
}

function removeQuestion(id) {
 draftQuestions = draftQuestions.filter(q => q.id !== id);
 renderQuestions();
}

function publishExam() {
 const title = document.getElementById("examName").value.trim();
 const duration = Number(document.getElementById("examDuration").value);
 const total = Number(document.getElementById("examTotal").value);

 if (!title || duration < 1 || total < 1 || !draftQuestions.length)
  return alert("أكمل بيانات الامتحان وأضف سؤالاً واحداً على الأقل");

 const questions = [];
 for (const q of draftQuestions) {
  const box = document.getElementById("q_" + q.id);
  const text = box.querySelector(".q-title").value.trim();
  if (!text) return alert("هناك سؤال بدون نص");

  let item = { type: q.type, text, mark: total / draftQuestions.length };

  if (q.type === "mcq") {
   item.options = [...box.querySelectorAll(".q-option")].map(x => x.value.trim());
   if (item.options.some(x => !x)) return alert("أكمل الاختيارات الأربعة");
   item.correct = Number(box.querySelector(".q-correct").value);
  }
  if (q.type === "tf") item.correct = box.querySelector(".q-correct").value === "true";
  if (q.type === "text") {
   item.model = box.querySelector(".q-model").value.trim();
   if (!item.model) return alert("اكتب الإجابة النموذجية");
  }
  questions.push(item);
 }

 exams.push({
  id: Date.now(), title, duration, total, questions,
  created: new Date().toLocaleDateString("ar-EG")
 });

 save();
 alert("تم إنشاء الامتحان بنجاح");
 go("exams");
}

function startExam(id) {
 const e = exams.find(x => x.id === id);
 if (!e) return;

 if (results.some(r => r.examId === id && r.username === currentUser.username))
  return alert("لقد قمت بحل هذا الامتحان بالفعل");

 activeExam = e;
 const c = document.getElementById("content");

 c.innerHTML = `
 <div class="panel">
  <h2>${esc(e.title)}</h2>
  <p class="muted">المدة: ${e.duration} دقيقة | الدرجة: ${e.total}</p>
  <h3 id="timer" style="color:var(--red)">الوقت: ${e.duration}:00</h3>
  <div id="takeQuestions"></div>
  <button class="primary" onclick="submitExam()">تسليم الامتحان</button>
 </div>`;

 document.getElementById("takeQuestions").innerHTML = e.questions.map((q, i) => `
 <div class="exam-question">
  <strong>${i + 1}. ${esc(q.text)}</strong>
  ${q.type === "mcq" ? q.options.map((o, j) => `
   <label><input type="radio" name="answer_${i}" value="${j}">${esc(o)}</label>
  `).join("") : ""}
  ${q.type === "tf" ? `
   <label><input type="radio" name="answer_${i}" value="true">صح</label>
   <label><input type="radio" name="answer_${i}" value="false">خطأ</label>` : ""}
  ${q.type === "text" ? `<textarea id="answer_${i}" placeholder="اكتب إجابتك هنا"></textarea>` : ""}
 </div>`).join("");

 let seconds = e.duration * 60;
 const timer = document.getElementById("timer");

 if (window.examTimer) clearInterval(window.examTimer);

 window.examTimer = setInterval(() => {
  seconds--;
  if (!document.getElementById("timer")) {
   clearInterval(window.examTimer);
   return;
  }
  timer.textContent = "الوقت: " + Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
  if (seconds <= 0) submitExam();
 }, 1000);
}

// ===================================
// GRADING
// ===================================

function submitExam() {
 if (!activeExam) return;
 if (window.examTimer) clearInterval(window.examTimer);

 let score = 0;
 let pending = 0;
 let answers = [];

 activeExam.questions.forEach((q, i) => {
  let answer = null;
  if (q.type === "mcq" || q.type === "tf") {
   const selected = document.querySelector(`input[name="answer_${i}"]:checked`);
   answer = selected ? selected.value : null;
   const correct = q.type === "mcq"
    ? answer !== null && Number(answer) === q.correct
    : answer !== null && (answer === "true") === q.correct;
   if (correct) score += q.mark;
  } else {
   const field = document.getElementById("answer_" + i);
   answer = field ? field.value.trim() : "";
   pending++;
  }
  answers.push({ answer });
 });

 const finalScore = Math.round(score * 100) / 100;
 const currentExamTotal = activeExam.total;
 const currentExamTitle = activeExam.title;
 const currentExamId = activeExam.id;

 results.push({
  id: Date.now(),
  examId: currentExamId,
  exam: currentExamTitle,
  username: currentUser.username,
  student: currentUser.name,
  score: finalScore,
  objectiveScore: finalScore,
  total: currentExamTotal,
  pending,
  answers,
  date: new Date().toLocaleDateString("ar-EG")
 });

 save();
 activeExam = null;

 document.getElementById("content").innerHTML = `
 <div class="panel" style="text-align:center;padding:40px">
  <div style="font-size:45px">🎉</div>
  <h2>تم تسليم الامتحان بنجاح</h2>
  <h1 style="color:var(--blue)">${finalScore} / ${currentExamTotal}</h1>
  <p class="muted">الدرجة المعروضة للأسئلة الموضوعية فقط.</p>
  ${pending ? `<p class="notice">لديك ${pending} سؤال نصي في انتظار تصحيح المدرس.</p>` : ""}
  <button class="primary" onclick="go('studentExams')">العودة للامتحانات</button>
 </div>`;
}

     ${isTeacher ? `<td>${r.pending ? `<button class="btn-small" onclick="gradeResult(${r.id})">تصحيح (${r.pending})</button>` : "مكتمل"}</td>` : ""}

function gradeResult(id) {
 const r = results.find(x => x.id === id);
 if (!r) return;
 const exam = exams.find(x => x.id === r.examId);
 if (!exam) return alert("الامتحان غير موجود");

 const c = document.getElementById("content");
 const textQuestions = exam.questions.map((q, i) => ({ q, i })).filter(x => x.q.type === "text");

 c.innerHTML = `
 <div class="panel">
  <h3>تصحيح إجابات ${esc(r.student)}</h3>
  <p class="muted">${esc(r.exam)}</p>
  ${textQuestions.map(({ q, i }) => {
   const ans = r.answers[i] || {};
   return `
   <div class="question-builder">
    <strong>${esc(q.text)}</strong>
    <p>إجابة الطالب: ${esc(ans.answer || "لم يجب")}</p>
    <p class="muted">الإجابة النموذجية: ${esc(q.model)}</p>
    <label>درجة السؤال (من ${q.mark})</label>
    <input type="number" min="0" max="${q.mark}" step="0.01"
     id="grade_${i}" value="${ans.manualScore ?? 0}">
   </div>`;
  }).join("")}
  <button class="primary" onclick="saveGrades(${id})">حفظ التصحيح</button>
 </div>`;
}

function saveGrades(id) {
 const r = results.find(x => x.id === id);
 if (!r) return;
 const exam = exams.find(x => x.id === r.examId);
 if (!exam) return alert("الامتحان غير موجود");

 let extra = 0;
 let hasError = false;

 exam.questions.forEach((q, i) => {
  if (q.type !== "text") return;
  const input = document.getElementById("grade_" + i);
  if (!input) return;
  const value = Number(input.value);
  if (!Number.isFinite(value) || value < 0 || value > q.mark) {
   hasError = true;
   return;
  }
  if (!r.answers[i]) r.answers[i] = {};
  r.answers[i].manualScore = value;
  extra += value;
 });

 if (hasError) return alert("راجع درجات الأسئلة النصية");

 const objective = (typeof r.objectiveScore === "number") ? r.objectiveScore : r.score;
 r.score = Math.round((objective + extra) * 100) / 100;
 r.pending = 0;

 save();
 alert("تم حفظ التصحيح");
 go("results");
}
