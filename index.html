
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة مستر أحمد محمود</title>

<style>
:root {
 --navy:#14243c;
 --blue:#3568e8;
 --bg:#f4f7fc;
 --white:#fff;
 --text:#202d42;
 --muted:#8491a5;
 --border:#e7ecf3;
 --green:#16a36a;
 --red:#e34e5b;
}
* {box-sizing:border-box}
body {
 margin:0;
 font-family:Tahoma,Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
}
button,input,select,textarea {font:inherit}
button {cursor:pointer;border:0}
.hidden {display:none!important}

/* Login */
.login-page {
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:20px;
 background:linear-gradient(135deg,#12243e,#284d81);
}
.login-box {
 background:white;
 width:100%;
 max-width:420px;
 padding:35px;
 border-radius:22px;
 box-shadow:0 20px 70px #0003;
}
.logo {
 width:58px;height:58px;
 display:grid;place-items:center;
 background:#e9efff;color:var(--blue);
 border-radius:17px;
 font-size:27px;margin-bottom:18px;
}
.login-box h2 {margin:0 0 8px}
.muted {color:var(--muted);font-size:13px}
.field {margin:18px 0}
.field label {display:block;font-size:13px;margin-bottom:8px}
input,select,textarea {
 width:100%;padding:12px;
 border:1px solid var(--border);
 border-radius:10px;
 background:white;outline:none;
}
input:focus,select:focus,textarea:focus {
 border-color:var(--blue);
}
.primary {
 background:var(--blue);
 color:white;padding:12px 18px;
 border-radius:10px;
}
.primary:hover {background:#2453c8}
.full {width:100%}
.error {color:var(--red);font-size:13px;margin-top:12px}

/* Application layout */
.app {min-height:100vh}
.sidebar {
 position:fixed;right:0;top:0;bottom:0;
 width:250px;background:var(--navy);
 color:white;padding:23px 16px;
 display:flex;flex-direction:column;
 z-index:5;
}
.brand {
 display:flex;align-items:center;gap:12px;
 padding:8px 5px 28px;
 border-bottom:1px solid #ffffff20;
}
.brand-icon {
 background:#ffff;padding:12px;
 border-radius:12px;font-size:20px;
}
.brand strong {display:block;font-size:15px}
.brand small {color:#aebbd0}
.menu-title {
 color:#8193ac;font-size:11px;
 margin:25px 12px 10px;
}
.menu button {
 display:block;width:100%;
 text-align:right;color:#c3cee0;
 background:transparent;padding:13px;
 border-radius:9px;margin:4px 0;
 font-size:13px;
}
.menu button:hover,.menu button.active {
 background:#ffffff17;color:white;
}
.logout {
 margin-top:auto;background:#ffffff12;
 color:#ffb7b7;padding:13px;border-radius:9px;
}
.main {margin-right:250px;padding:28px 35px}
.topbar {
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:28px;
 gap:15px;
}
.topbar h2 {margin:0 0 7px;font-size:23px}
.profile {
 background:white;padding:10px 15px;
 border:1px solid var(--border);
 border-radius:12px;display:flex;
 align-items:center;gap:10px;
}
.avatar {
 width:38px;height:38px;border-radius:12px;
 background:#e7eeff;color:var(--blue);
 display:grid;place-items:center;font-weight:bold;
}
.grid {
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:16px;margin-bottom:23px;
}
.stat,.panel,.card {
 background:white;border:1px solid var(--border);
 border-radius:15px;padding:20px;
}
.stat small {color:var(--muted)}
.stat h2 {font-size:28px;margin:12px 0 5px}
.stat .symbol {font-size:22px;color:var(--blue)}
.panel {margin-bottom:20px}
.panel h3 {margin:0 0 18px;font-size:17px}
.section-title {
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:18px;
}
.section-title h3 {margin:0}
.cards {
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:15px;
}
.card h3 {font-size:16px;margin:8px 0}
.card p {font-size:13px;color:var(--muted);line-height:1.8}
.tag {
 display:inline-block;padding:5px 9px;
 background:#edf2ff;color:var(--blue);
 border-radius:7px;font-size:11px;
}
.btn-small {
 padding:8px 12px;border-radius:8px;
 background:#edf2ff;color:var(--blue);
 font-size:12px;margin:3px;
}
.btn-danger {background:#fff0f0;color:var(--red)}
.btn-green {background:#e7f8ef;color:var(--green)}
table {width:100%;border-collapse:collapse;font-size:13px}
th,td {padding:14px 10px;text-align:right;border-bottom:1px solid var(--border)}
th {color:var(--muted);font-weight:normal}
.empty {text-align:center;color:var(--muted);padding:30px}
.form-grid {
 display:grid;grid-template-columns:1fr 1fr;gap:15px;
}
.form-grid .field {margin:5px 0}
textarea {min-height:110px;resize:vertical}
.question-builder {
 padding:16px;border:1px solid var(--border);
 border-radius:12px;margin:14px 0;
}
.question-builder h4 {margin:0 0 12px}
.option-grid {
 display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.exam-question {
 border:1px solid var(--border);
 padding:18px;border-radius:12px;margin:14px 0;
}
.exam-question label {
 display:block;padding:10px;background:#f7f9fc;
 margin:8px 0;border-radius:8px;
 cursor:pointer;font-size:14px;
}
.exam-question input {width:auto;margin-left:8px}
.notice {
 padding:14px;border-radius:10px;
 background:#fff6df;color:#966b17;
 font-size:13px;line-height:1.8;
}
.progress {
 height:8px;background:#e9edf5;
 border-radius:10px;overflow:hidden;margin:12px 0;
}
.progress span {display:block;height:100%;background:var(--blue)}
@media(max-width:900px) {
 .sidebar {width:200px}
 .main {margin-right:200px;padding:20px}
 .grid {grid-template-columns:repeat(2,1fr)}
 .cards {grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px) {
 .sidebar {
  position:relative;width:100%;
  height:auto;padding:12px;
 }
 .brand {padding-bottom:12px}
 .menu {display:flex;overflow-x:auto}
 .menu-title {display:none}
 .menu button {min-width:max-content;padding:10px}
 .logout {margin-top:10px}
 .main {margin:0;padding:15px}
 .grid {gap:8px}
 .stat {padding:13px}
 .stat h2 {font-size:22px}
 .cards,.form-grid {grid-template-columns:1fr}
 .topbar h2 {font-size:18px}
}

/* ===== Visual refresh ===== */
:root {
  --navy:#101d33;
  --blue:#4169f5;
  --bg:#f5f7fc;
  --text:#1d2a40;
  --muted:#77859b;
  --border:#e8edf5;
  --surface:#ffffff;
  --shadow:0 8px 28px rgba(25,45,80,.06);
}
body { background:var(--bg); }
.login-page {
  background:
    radial-gradient(circle at 15% 20%, #5f83ff55, transparent 30%),
    radial-gradient(circle at 85% 80%, #6ab6ff33, transparent 28%),
    linear-gradient(135deg,#101d33,#254b80);
}
.login-box {
  border:1px solid #ffffff70;
  box-shadow:0 28px 90px #07152c66;
  animation:loginIn .45s ease both;
}
@keyframes loginIn {
  from { opacity:0; transform:translateY(12px) scale(.985); }
  to { opacity:1; transform:translateY(0) scale(1); }
}
.login-box h2 { color:#172945; letter-spacing:-.3px; }
.logo { box-shadow:0 8px 20px #3568e822; }
.sidebar {
  background:linear-gradient(180deg,#101d33,#172d4d);
  box-shadow:-8px 0 30px #0c1b3212;
}
.brand-icon {
  display:grid; place-items:center;
  min-width:44px; min-height:44px;
  background:linear-gradient(135deg,#fff,#e8efff);
  color:var(--blue);
  box-shadow:0 5px 16px #0002;
}
.menu button {
  transition:background .2s ease, color .2s ease, transform .2s ease;
}
.menu button:hover { transform:translateX(-3px); }
.menu button.active {
  background:linear-gradient(90deg,#ffffff28,#ffffff0d);
  box-shadow:inset -3px 0 #8eafff;
}
.main { max-width:1600px; }
.topbar { min-height:64px; }
.topbar h2 { letter-spacing:-.4px; }
.profile {
  box-shadow:0 4px 16px #1b31500a;
  transition:box-shadow .2s ease, transform .2s ease;
}
.profile:hover { box-shadow:var(--shadow); transform:translateY(-1px); }
.stat,.panel,.card {
  background:var(--surface);
  border-color:var(--border);
  box-shadow:var(--shadow);
  transition:transform .2s ease, box-shadow .2s ease;
}
.stat:hover,.card:hover {
  transform:translateY(-3px);
  box-shadow:0 14px 34px rgba(25,45,80,.10);
}
.stat { position:relative; overflow:hidden; }
.stat:after {
  content:""; position:absolute; left:-24px; bottom:-34px;
  width:92px; height:92px; border-radius:50%;
  background:#4169f50b;
}
.stat .symbol { display:inline-grid; place-items:center; width:40px;height:40px;
  border-radius:12px;background:#edf2ff;margin-bottom:8px; }
.card { display:flex; flex-direction:column; align-items:flex-start; }
.card p { flex:1; }
.primary,.btn-small,.btn-danger,.btn-green,.logout,.icon-action {
  transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
}
.primary { box-shadow:0 5px 14px #3568e82b; }
.primary:hover,.btn-small:hover,.logout:hover,.icon-action:hover {
  filter:brightness(.97); transform:translateY(-1px);
}
input,select,textarea {
  transition:border-color .2s ease, box-shadow .2s ease;
}
input:focus,select:focus,textarea:focus {
  border-color:var(--blue);
  box-shadow:0 0 0 3px #4169f51c;
}
table tr:hover td { background:#f8faff; }
.tag { font-weight:600; }
.icon-action {
  display:grid;place-items:center;
  width:42px;height:42px;border-radius:12px;
  background:#fff;color:var(--navy);
  border:1px solid var(--border);font-size:19px;
}
.topbar-actions { margin-right:auto; }
.mobile-menu-button { display:none; }
.sidebar-backdrop { display:none; }

/* Optional dark appearance */
body.dark-mode {
  --bg:#0c1422; --surface:#142136; --text:#e8eef8;
  --muted:#9aa9bf; --border:#263750; --navy:#0b1525;
  background:var(--bg); color:var(--text);
}
body.dark-mode .profile,
body.dark-mode .icon-action,
body.dark-mode input,
body.dark-mode select,
body.dark-mode textarea { background:#142136;color:var(--text);border-color:var(--border); }
body.dark-mode .stat,body.dark-mode .panel,body.dark-mode .card { background:var(--surface); }
body.dark-mode .menu button.active { background:#ffffff20; }
body.dark-mode table tr:hover td { background:#1b2b43; }
body.dark-mode .exam-question label { background:#1b2b43; }
body.dark-mode .tag,.dark-mode .btn-small { background:#22385c;color:#b9ccff; }
body.dark-mode .stat .symbol { background:#22385c; }
body.dark-mode .notice { background:#3a321f;color:#f3d58b; }

@media(max-width:900px) {
  .main { padding:22px; }
}
@media(max-width:600px) {
  .sidebar {
    position:fixed; right:0; top:0; bottom:0;
    width:min(290px,84vw); height:100vh;
    padding:18px 14px;
    transform:translateX(105%);
    transition:transform .25s ease;
    overflow-y:auto;
    z-index:20;
  }
  .sidebar.open { transform:translateX(0); }
  .sidebar-backdrop {
    position:fixed; inset:0; z-index:19;
    background:#07132680; backdrop-filter:blur(2px);
  }
  .sidebar-backdrop.show { display:block; }
  .brand { padding-bottom:18px; }
  .menu { display:block; overflow:visible; }
  .menu-title { display:block; }
  .menu button { min-width:0; padding:13px; }
  .logout { margin-top:20px; width:100%; }
  .main { margin:0; padding:14px; }
  .topbar { gap:9px; align-items:center; margin-bottom:20px; }
  .mobile-menu-button { display:grid; flex:0 0 42px; }
  .topbar-actions { margin-right:auto; }
  .profile { padding:7px 9px; gap:7px; }
  .profile .muted { font-size:11px; }
  .avatar { width:34px;height:34px; }
  .topbar h2 { font-size:17px; }
  .topbar .muted { font-size:11px; }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .stat { min-width:0; padding:13px; }
  .stat h2 { font-size:21px; }
  .cards,.form-grid { grid-template-columns:1fr; }
  .panel { padding:16px; }
  .section-title { gap:10px; flex-wrap:wrap; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
}


/* Login page refresh v3 */
.login-page {
 position:relative;overflow:hidden;
 background:
  radial-gradient(circle at 12% 18%,#6d8fff55 0,transparent 28%),
  radial-gradient(circle at 88% 82%,#40c6c455 0,transparent 25%),
  linear-gradient(135deg,#101d35,#1e3d69 58%,#254f82);
}
.login-page:before,.login-page:after {
 content:"";position:absolute;border:1px solid #ffffff18;border-radius:50%;
 width:430px;height:430px;pointer-events:none;
}
.login-page:before {top:-250px;right:-140px}
.login-page:after {bottom:-300px;left:-160px;width:560px;height:560px}
.login-box {
 position:relative;z-index:1;max-width:440px;padding:38px 36px 30px;
 border:1px solid #ffffffa8;border-radius:25px;
 box-shadow:0 28px 90px #06152d66;
}
.login-brand {
 width:68px;height:68px;display:grid;place-items:center;margin:0 auto 18px;
 border-radius:21px;color:#fff;background:linear-gradient(145deg,#4779f4,#244fc2);
 box-shadow:0 10px 25px #3568e844;font-size:31px;
}
.login-box h2 {margin:0 0 9px;text-align:center;color:#172945;font-size:24px}
.login-subtitle {text-align:center;line-height:1.8;margin:0 0 27px;color:#8290a5;font-size:13px}
.login-box .field {margin:17px 0}
.login-box .field label {display:block;font-size:13px;font-weight:700;color:#35445b;margin-bottom:9px}
.login-box input {
 width:100%;padding:14px;border:1px solid #e1e7f0;border-radius:12px;
 background:#f9fbfe;outline:none;color:#1d2b41;transition:.2s;
}
.login-box input:focus {border-color:#4779f4;background:#fff;box-shadow:0 0 0 4px #4779f41c}
.password-wrap {position:relative}
.password-wrap input {padding-left:76px}
.show-password {
 position:absolute;left:8px;top:50%;transform:translateY(-50%);
 padding:7px 9px;border-radius:8px;background:#edf2ff;color:#315ed0;
 font-size:12px;font-weight:700;
}
.login-submit {
 width:100%;margin-top:8px;padding:14px 18px;border-radius:12px;
 color:#fff;background:linear-gradient(110deg,#4779f4,#2856ce);
 font-weight:700;box-shadow:0 8px 18px #3568e833;transition:transform .2s,box-shadow .2s;
}
.login-submit:hover {transform:translateY(-1px);box-shadow:0 12px 22px #3568e844}
.login-error {min-height:18px;color:var(--red);font-size:13px;text-align:center;margin:12px 0 0}
.login-footer {border-top:1px solid #edf0f5;margin-top:24px;padding-top:17px;text-align:center;color:#a0aaba;font-size:11px}
@media(max-width:480px) {.login-box{padding:30px 22px 24px;border-radius:21px}.login-box h2{font-size:21px}}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
 <div class="login-box">
  <div class="login-brand" aria-hidden="true">🎓</div>
  <h2>منصة مستر أحمد محمود</h2>
  <p class="login-subtitle">مرحبًا بك من جديد<br>سجّل الدخول للوصول إلى دروسك واختباراتك</p>

  <div class="field">
   <label for="loginUser">اسم المستخدم</label>
   <input id="loginUser" autocomplete="username" placeholder="اكتب اسم المستخدم">
  </div>

  <div class="field">
   <label for="loginPass">كلمة المرور</label>
   <div class="password-wrap">
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="اكتب كلمة المرور" onkeydown="if(event.key==='Enter') login()">
    <button class="show-password" type="button" onclick="toggleLoginPassword()" id="showPasswordBtn">إظهار</button>
   </div>
  </div>

  <button class="login-submit" type="button" onclick="login()">تسجيل الدخول</button>
  <p id="loginError" class="login-error" role="alert"></p>
  <div class="login-footer">منصة تعليمية لتنظيم الدروس والاختبارات والنتائج</div>
 </div>
</div>

<!-- APP -->
<div class="app hidden" id="app">

 <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
  <aside class="sidebar">
  <div class="brand">
   <div class="brand-icon">🎓</div>
   <div>
    <strong>منصه تعليمية</strong>
    <small>مستر / أحمد محمود</small>
    <br>
    <small>Mr \ Ahmed Mahmoud</small>
   </div>
  </div>

  <div class="menu-title">القائمة الرئيسية</div>
  <nav class="menu" id="menu"></nav>
  <button class="logout" onclick="logout()">↪ تسجيل الخروج</button>
 </aside>

 <main class="main">
  <div class="topbar">
   <button class="icon-action mobile-menu-button" type="button" onclick="toggleSidebar()" aria-label="فتح القائمة">☰</button>
   <div>
    <h2 id="pageTitle">الرئيسية</h2>
    <p class="muted" id="pageSubtitle">مرحباً بك في منصتك التعليمية</p>
   </div>
   <div class="topbar-actions">
    <button class="icon-action theme-toggle" type="button" onclick="toggleTheme()" aria-label="تغيير المظهر" title="تغيير المظهر">☾</button>
   </div>
   <div class="profile">
    <div class="avatar" id="avatar">A</div>
    <div>
     <strong id="profileName">أحمد</strong>
     <div class="muted" id="profileRole">مدرس</div>
    </div>
   </div>
  </div>
  <div id="content"></div>
 </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.9.0/mammoth.browser.min.js"></script>
<script>
// ===================================
// DATA
// ===================================

const getData = (key, fallback) => {
 try {
  const data = localStorage.getItem(key);
  return data ? JSON.parse(data) : fallback;
 } catch {
  return fallback;
 }
};

let users = getData("ah_users",[
 {id:1,name:"أحمد محمود",username:"ahmed",password:"1234",role:"teacher"},
 {id:2,name:"علي محمد",username:"ali",password:"1234",role:"student"}
]);

let lessons = getData("ah_lessons",[
 {id:1,title:"مقدمة في Python",description:"تعرف على لغة Python وأهم استخداماتها.",content:"Python لغة برمجة سهلة وقوية.\n\nمثال:\nprint('Hello World')"},
 {id:2,title:"المتغيرات",description:"تعلم كيفية تخزين البيانات.",content:"المتغير يستخدم لتخزين البيانات.\n\nمثال:\nname = 'Ahmed'\nage = 16"}
]);

let exams = getData("ah_exams",[]);
let results = getData("ah_results",[]);
let assignments = getData("ah_assignments",[]);
let currentUser = null;
let activeExam = null;

function save() {
 localStorage.setItem("ah_users",JSON.stringify(users));
 localStorage.setItem("ah_lessons",JSON.stringify(lessons));
 localStorage.setItem("ah_exams",JSON.stringify(exams));
 localStorage.setItem("ah_results",JSON.stringify(results));
 localStorage.setItem("ah_assignments",JSON.stringify(assignments));
}

function esc(value) {
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

// ===================================
// LOGIN
// ===================================


function toggleLoginPassword() {
 const input = document.getElementById("loginPass");
 const button = document.getElementById("showPasswordBtn");
 const visible = input.type === "password";
 input.type = visible ? "text" : "password";
 button.textContent = visible ? "إخفاء" : "إظهار";
}

function login() {
 const username=document.getElementById("loginUser").value.trim();
 const password=document.getElementById("loginPass").value;

 const user=users.find(u=>u.username===username && u.password===password);

 if(!user) {
  document.getElementById("loginError").textContent="اسم المستخدم أو كلمة المرور غير صحيحة";
  return;
 }

 currentUser=user;
 document.getElementById("loginPage").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");

 document.getElementById("profileName").textContent=user.name;
 document.getElementById("avatar").textContent=user.name[0]||"A";
 document.getElementById("profileRole").textContent=
  user.role==="teacher"?"مدرس":"طالب";

 buildMenu();
 go(user.role==="teacher"?"home":"studentHome");
}

function logout() {
 currentUser=null;
 activeExam=null;
 document.getElementById("app").classList.add("hidden");
 document.getElementById("loginPage").classList.remove("hidden");
 document.getElementById("loginPass").value="";
}

// ===================================
// MENU
// ===================================

function buildMenu() {
 const items=currentUser.role==="teacher"?[
  ["home","▦","الرئيسية"],
  ["users","♙","إدارة الحسابات"],
  ["lessons","▤","إدارة الدروس"],
  ["teacherAssignments","📝","الواجبات"],
  ["createExam","✎","إنشاء امتحان"],
  ["exams","▣","الامتحانات"],
  ["results","◷","نتائج الطلاب"]
 ]:[
  ["studentHome","▦","الرئيسية"],
  ["studentLessons","▤","الدروس"],
  ["studentAssignments","📝","الواجبات"],
  ["studentExams","▣","الامتحانات"],
  ["studentResults","◷","نتائجي"]
 ];

async function importWordLesson(event) {

 const file = event.target.files[0];

 if(!file) return;

 if(!file.name.toLowerCase().endsWith(".docx")) {
  alert("من فضلك اختر ملف Word بصيغة DOCX");
  event.target.value="";
  return;
 }

 try {

  const arrayBuffer = await file.arrayBuffer();

  const result = await mammoth.extractRawText({
   arrayBuffer: arrayBuffer
  });

  const content = result.value.trim();

  if(!content) {
   alert("الملف لا يحتوي على نص");
   return;
  }

  document.getElementById("lessonText").value = content;

  const titleInput = document.getElementById("lessonName");

  if(!titleInput.value.trim()) {
   titleInput.value = file.name.replace(/\.docx$/i,"");
  }

  alert("تم استيراد الدرس بنجاح من ملف Word");

 } catch(error) {

  alert("حدث خطأ أثناء قراءة ملف Word");

  console.error(error);

 }

 event.target.value="";
}

function submitHomework(id) {
 const a=assignments.find(x=>x.id===id);
 if(!a)return alert("الواجب غير موجود");
 const existing=(a.submissions||[]).find(s=>s.username===currentUser.username);
 if(existing&&existing.grade!==null&&existing.grade!==undefined)
  return alert("تم تصحيح هذا الواجب بالفعل، ولا يمكن تعديل الإجابة");

 const field=document.getElementById("homeworkAnswer_"+id);
 const answer=field?field.value.trim():"";
 if(!answer)return alert("اكتب إجابتك قبل الإرسال");

 if(!a.submissions)a.submissions=[];
 const submission={
  username:currentUser.username,
  studentName:currentUser.name,
  answer,
  submittedAt:new Date().toLocaleString("ar-EG"),
  grade:null,
  feedback:""
 };
 const index=a.submissions.findIndex(s=>s.username===currentUser.username);
 if(index>=0)a.submissions[index]=submission;
 else a.submissions.push(submission);

 save();
 alert("تم إرسال إجابتك بنجاح");
 go("studentAssignments");
}

function gradeHomework(assignmentId,submissionIndex) {
 const a=assignments.find(x=>x.id===assignmentId);
 if(!a)return;
 const submission=(a.submissions||[])[submissionIndex];
 if(!submission)return;

 const rawGrade=prompt("اكتب درجة الطالب من "+a.total,submission.grade??"");
 if(rawGrade===null)return;
 const grade=Number(rawGrade);
 if(rawGrade.trim()===""||!Number.isFinite(grade)||grade<0||grade>a.total)
  return alert("اكتب درجة صحيحة من 0 إلى "+a.total);

 const feedback=prompt("اكتب ملاحظاتك للطالب (اختياري)",submission.feedback||"");
 if(feedback===null)return;

 submission.grade=grade;
 submission.feedback=feedback.trim();
 submission.gradedAt=new Date().toLocaleString("ar-EG");
 save();
 alert("تم حفظ التصحيح بنجاح");
 go("teacherAssignments");
}

  <div class="${q.type==="mcq"?"option-grid":""}">
  ${q.type==="mcq"?[0,1,2,3].map(n=>`
   <input class="q-option" placeholder="الاختيار ${n+1}">
  `).join(""):""}
  </div>
  ${q.type==="mcq"?`
   <label>الإجابة الصحيحة</label>
   <select class="q-correct">
    <option value="0">الاختيار الأول</option>
    <option value="1">الاختيار الثاني</option>
    <option value="2">الاختيار الثالث</option>
    <option value="3">الاختيار الرابع</option>
   </select>`:""}
  ${q.type==="tf"?`
   <label>الإجابة الصحيحة</label>
   <select class="q-correct">
    <option value="true">صح</option>
    <option value="false">خطأ</option>
   </select>`:""}
  ${q.type==="text"?`
   <label>الإجابة النموذجية للتصحيح اليدوي</label>
   <input class="q-model" placeholder="اكتب الإجابة النموذجية">
   <p class="muted">سيتم عرض إجابة الطالب للمدرس لتصحيحها يدوياً.</p>`:""}
  <button class="btn-small btn-danger" onclick="removeQuestion(${q.id})">حذف السؤال</button>
 </div>`).join("");
}

function removeQuestion(id) {
 draftQuestions=draftQuestions.filter(q=>q.id!==id);
 renderQuestions();
}

function publishExam() {
 const title=document.getElementById("examName").value.trim();
 const duration=Number(document.getElementById("examDuration").value);
 const total=Number(document.getElementById("examTotal").value);

 if(!title||duration<1||total<1||!draftQuestions.length)
  return alert("أكمل بيانات الامتحان وأضف سؤالاً واحداً على الأقل");

 const questions=[];
 for(const q of draftQuestions) {
  const box=document.getElementById("q_"+q.id);
  const text=box.querySelector(".q-title").value.trim();
  if(!text)return alert("هناك سؤال بدون نص");

  let item={type:q.type,text,mark:total/draftQuestions.length};

  if(q.type==="mcq") {
   item.options=[...box.querySelectorAll(".q-option")].map(x=>x.value.trim());
   if(item.options.some(x=>!x))return alert("أكمل الاختيارات الأربعة");
   item.correct=Number(box.querySelector(".q-correct").value);
  }
  if(q.type==="tf")item.correct=box.querySelector(".q-correct").value==="true";
  if(q.type==="text") {
   item.model=box.querySelector(".q-model").value.trim();
   if(!item.model)return alert("اكتب الإجابة النموذجية");
  }
  questions.push(item);
 }

 exams.push({
  id:Date.now(),title,duration,total,questions,
  created:new Date().toLocaleDateString("ar-EG")
 });

 save();
 alert("تم إنشاء الامتحان بنجاح");
 go("exams");
}

// EXAM MANAGEMENT
// ===================================

function examManagement(c) {
 c.innerHTML=`
 <div class="panel">
  <div class="section-title">
   <h3>الامتحانات المنشورة</h3>
   <button class="primary" onclick="go('createExam')">+ امتحان جديد</button>
  </div>
  ${exams.length?`<table>
   <tr><th>الامتحان</th><th>الأسئلة</th><th>الدرجة</th><th>المدة</th><th>الإجراء</th></tr>
   ${exams.map(e=>`<tr>
    <td>${esc(e.title)}</td>
    <td>${e.questions.length}</td>
    <td>${e.total}</td>
    <td>${e.duration} دقيقة</td>
    <td><button class="btn-small btn-danger" onclick="deleteExam(${e.id})">حذف</button></td>
   </tr>`).join("")}
  </table>`:`<div class="empty">لم يتم إنشاء امتحانات بعد</div>`}

function deleteExam(id) {

 exams=exams.filter(e=>e.id!==id);
 save();go("exams");
}

// ===================================
// STUDENT LESSONS
// ===================================

function studentLessons(c) {
 c.innerHTML=`<div class="panel">
 <h3>دروس المنهج</h3>${lessonCards(false)}</div>`;
}

// ===================================
// STUDENT EXAMS
// ===================================

function studentExams(c) {
 c.innerHTML=`
 <div class="panel">
  <h3>الامتحانات المتاحة</h3>
  ${exams.length?`<div class="cards">${exams.map(e=>{
   const done=results.some(r=>r.examId===e.id&&r.username===currentUser.username);
   return `<div class="card">
    <span class="tag">${e.duration} دقيقة</span>
    <h3>${esc(e.title)}</h3>
    <p>${e.questions.length} أسئلة - ${e.total} درجة</p>
    ${done?`<span class="tag">تم الحل</span>`:
     `<button class="primary" onclick="startExam(${e.id})">ابدأ الامتحان</button>`}
   </div>`;
  }).join("")}</div>`:`<div class="empty">لا توجد امتحانات متاحة حالياً</div>`}
 </div>`;
}

function startExam(id) {
 const e=exams.find(x=>x.id===id);
 if(!e)return;

 if(results.some(r=>r.examId===id&&r.username===currentUser.username))
  return alert("لقد قمت بحل هذا الامتحان بالفعل");

 activeExam=e;
 const c=document.getElementById("content");

 c.innerHTML=`
 <div class="panel">
  <h2>${esc(e.title)}</h2>
  <p class="muted">المدة: ${e.duration} دقيقة | الدرجة: ${e.total}</p>
  <h3 id="timer" style="color:var(--red)">الوقت: ${e.duration}:00</h3>
  <div id="takeQuestions"></div>
  <button class="primary" onclick="submitExam()">تسليم الامتحان</button>
 </div>`;

 document.getElementById("takeQuestions").innerHTML=e.questions.map((q,i)=>`
 <div class="exam-question">
  <strong>${i+1}. ${esc(q.text)}</strong>
  ${q.type==="mcq"?q.options.map((o,j)=>`
   <label><input type="radio" name="answer_${i}" value="${j}">${esc(o)}</label>
  `).join(""):""}
  ${q.type==="tf"?`
   <label><input type="radio" name="answer_${i}" value="true">صح</label>
   <label><input type="radio" name="answer_${i}" value="false">خطأ</label>`:""}
  ${q.type==="text"?`<textarea id="answer_${i}" placeholder="اكتب إجابتك هنا"></textarea>`:""}
 </div>`).join("");

 let seconds=e.duration*60;
 const timer=document.getElementById("timer");

 if(window.examTimer)clearInterval(window.examTimer);

 window.examTimer=setInterval(()=>{
  seconds--;
  if(!document.getElementById("timer")) {
   clearInterval(window.examTimer);return;
  }
  timer.textContent="الوقت: "+Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");
  if(seconds<=0)submitExam();
 },1000);
}

// ===================================
// GRADING
// ===================================

function submitExam() {
 if(!activeExam)return;
 if(window.examTimer)clearInterval(window.examTimer);

 let score=0;
 let pending=0;
 let answers=[];

 activeExam.questions.forEach((q,i)=>{
  let answer=null;
  if(q.type==="mcq"||q.type==="tf") {
   const selected=document.querySelector(`input[name="answer_${i}"]:checked`);
   answer=selected?selected.value:null;
   const correct=q.type==="mcq"
    ?answer!==null&&Number(answer)===q.correct
    :answer!==null&&(answer==="true")===q.correct;
   if(correct)score+=q.mark;
  } else {
   answer=document.getElementById("answer_"+i).value.trim();
   pending++;
  }
  answers.push({answer});
 });

 const finalScore=Math.round(score*100)/100;
 results.push({
  id:Date.now(),
  examId:activeExam.id,
  exam:activeExam.title,
  username:currentUser.username,
  student:currentUser.name,
  score:finalScore,
  total:activeExam.total,
  pending,
  answers,
  date:new Date().toLocaleDateString("ar-EG")
 });

 save();

 document.getElementById("content").innerHTML=`
 <div class="panel" style="text-align:center;padding:40px">
  <div style="font-size:45px">🎉</div>
  <h2>تم تسليم الامتحان بنجاح</h2>
  <h1 style="color:var(--blue)">${finalScore} / ${activeExam.total}</h1>
  <p class="muted">الدرجة المعروضة للأسئلة الموضوعية فقط.</p>
  ${pending?`<p class="notice">لديك ${pending} سؤال نصي في انتظار تصحيح المدرس.</p>`:""}
  <button class="primary" onclick="activeExam=null;go('studentExams')">العودة للامتحانات</button>
 </div>`;
 activeExam=null;
}

// ===================================
// RESULTS
// ===================================

function showResults(c,isTeacher) {
 const list=isTeacher?results:results.filter(r=>r.username===currentUser.username);

 c.innerHTML=`
 <div class="panel">
  <h3>${isTeacher?"سجل نتائج الطلاب":"نتائج امتحاناتي"}</h3>
  ${list.length?`<div style="overflow-x:auto">
   <table>
    <tr><th>الطالب</th><th>الامتحان</th><th>الدرجة</th><th>التاريخ</th>
    ${isTeacher?"<th>التصحيح</th>":""}</tr>
    ${list.slice().reverse().map(r=>`<tr>
     <td>${esc(r.student)}</td>
     <td>${esc(r.exam)}</td>
     <td>${r.score}/${r.total}</td>
     <td>${esc(r.date)}</td>
     ${isTeacher?`<td>${r.pending?`<button class="btn-small" onclick="gradeResult(${r.id})">تصحيح (${r.pending})</button>`:"مكتمل"}</td>`:""}
    </tr>`).join("")}
   </table>
  </div>`:`<div class="empty">لا توجد نتائج حتى الآن</div>`}
 </div>`;
}

// تصحيح الأسئلة النصية
function gradeResult(id) {
 const r=results.find(x=>x.id===id);
 if(!r)return;
 const exam=exams.find(x=>x.id===r.examId);
 if(!exam)return alert("الامتحان غير موجود");

 const c=document.getElementById("content");
 let textQuestions=exam.questions.map((q,i)=>({q,i})).filter(x=>x.q.type==="text");

 c.innerHTML=`
 <div class="panel">
  <h3>تصحيح إجابات ${esc(r.student)}</h3>
  <p class="muted">${esc(r.exam)}</p>
  ${textQuestions.map(({q,i})=>`
   <div class="question-builder">
    <strong>${esc(q.text)}</strong>
    <p>إجابة الطالب: ${esc(r.answers[i].answer||"لم يجب")}</p>
    <p class="muted">الإجابة النموذجية: ${esc(q.model)}</p>
    <label>درجة السؤال (من ${q.mark})</label>
    <input type="number" min="0" max="${q.mark}" step="0.01"
     id="grade_${i}" value="${r.answers[i].manualScore??0}">
   </div>`).join("")}
  <button class="primary" onclick="saveGrades(${id})">حفظ التصحيح</button>
 </div>`;
}

function saveGrades(id) {
 const r=results.find(x=>x.id===id);
 const exam=exams.find(x=>x.id===r.examId);
 if(!r||!exam)return;

 let extra=0;
 let pending=0;

 exam.questions.forEach((q,i)=>{
  if(q.type!=="text")return;
  const value=Number(document.getElementById("grade_"+i).value);
  if(!Number.isFinite(value)||value<0||value>q.mark)
   return alert("راجع درجات الأسئلة النصية");
  r.answers[i].manualScore=value;
  extra+=value;
  if((r.answers[i].answer||"").trim()!=="")pending++;
 });

 r.score=Math.round((r.score+extra)*100)/100;
 r.pending=pending;

 save();
 alert("تم حفظ التصحيح");
 go("results");
}


// UI helpers: mobile navigation and theme preference
function toggleSidebar() {
  const sidebar=document.querySelector(".sidebar");
  const backdrop=document.getElementById("sidebarBackdrop");
  sidebar.classList.toggle("open");
  backdrop.classList.toggle("show");
}
function closeSidebar() {
  document.querySelector(".sidebar").classList.remove("open");
  document.getElementById("sidebarBackdrop").classList.remove("show");
}
function toggleTheme() {
  const enabled=document.body.classList.toggle("dark-mode");
  localStorage.setItem("ah_theme",enabled?"dark":"light");
  const button=document.querySelector(".theme-toggle");
  if(button) button.textContent=enabled?"☀":"☾";
}
(function restoreTheme(){
  const enabled=localStorage.getItem("ah_theme")==="dark";
  document.body.classList.toggle("dark-mode",enabled);
  const button=document.querySelector(".theme-toggle");
  if(button) button.textContent=enabled?"☀":"☾";
})();

// Initial storage
save();
</script>
